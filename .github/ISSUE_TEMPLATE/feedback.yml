name: Feedback & Feature Request
description: Suggest a feature, UX improvement, or share general feedback for TunnelForge
title: "[Feedback]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      default: 0
      options:
        - Feature request
        - UX / UI improvement
        - Documentation
        - General feedback
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What would you like to see or improve?
      description: Keep it clear and specific.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case (optional)
      description: How does this help your VPN, proxy, or routing setup?

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Mockups, server details, or workarounds you tried.
