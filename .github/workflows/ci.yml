name: CI

on:
  pull_request:
    branches:
      - main
      - release/**
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number to build a reviewer APK for
        required: false
        type: number

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      go: ${{ steps.filter.outputs.go }}
      native_c: ${{ steps.filter.outputs.native_c }}
      android_kotlin: ${{ steps.filter.outputs.android_kotlin }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - '!test/native/**'
              - 'pubspec.*'
              - 'l10n.yaml'
              - 'analysis_options.yaml'
              - '.github/workflows/ci.yml'
            go:
              - 'android/gvisor/**'
              - '.github/workflows/ci.yml'
            native_c:
              - 'android/app/src/main/cpp/**'
              - 'test/native/**'
              - '.github/workflows/ci.yml'
            android_kotlin:
              - 'android/**'
              - '!android/gvisor/**'
              - 'pubspec.*'
              - '.github/workflows/ci.yml'
            app:
              - 'lib/**'
              - 'assets/**'
              - 'android/**'
              - 'pubspec.*'
              - 'l10n.yaml'
              - '.github/workflows/ci.yml'

  flutter-checks:
    name: flutter-checks
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        if: github.event_name == 'pull_request'
        run: flutter test

      - name: Run unit and widget tests with coverage
        if: github.event_name != 'pull_request'
        run: flutter test --coverage

      - name: Save Dart coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          flags: dart
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  android-go-tests:
    name: Android Go native tests
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Download Android Go module dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Run Android Go module tests
        if: github.event_name == 'pull_request'
        working-directory: android/gvisor
        run: |
          go vet ./...
          go test -race ./...

      - name: Run Android Go module tests with coverage
        if: github.event_name != 'pull_request'
        working-directory: android/gvisor
        run: |
          go vet ./...
          go test -race ./... -coverprofile=gvisor.cover
          sed -i 's|^tunnel_forge_gvisor/|android/gvisor/|' gvisor.cover

      - name: Save Go coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: android/gvisor/gvisor.cover
          if-no-files-found: error

      - name: Upload Go coverage to Codecov
        if: github.event_name != 'pull_request' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: android/gvisor/gvisor.cover
          flags: go
          disable_search: true
          fail_ci_if_error: true

  native-c-tests:
    name: Native C tests
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.native_c == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore mbedTLS source cache
        id: cache-mbedtls
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/mbedtls-2.28.9
          key: mbedtls-src-v2.28.9

      - name: Download mbedTLS source
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/mbedtls-2.28.9"
          curl -fsSL https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v2.28.9.tar.gz \
            | tar -xz --strip-components=1 -C "${{ runner.temp }}/mbedtls-2.28.9"

      - name: Save mbedTLS source cache
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/mbedtls-2.28.9
          key: mbedtls-src-v2.28.9

      - name: Install LLVM coverage tools
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-dev llvm

      - name: Run host and production protocol tests
        if: github.event_name == 'pull_request'
        run: |
          cmake -S test/native -B build/native_test \
            -DCMAKE_BUILD_TYPE=Debug -DTUNNEL_FORGE_NATIVE_PROTOCOL_TESTS=ON \
            -DTUNNEL_FORGE_MBEDTLS_SOURCE_DIR="${{ runner.temp }}/mbedtls-2.28.9"
          cmake --build build/native_test --parallel
          ctest --test-dir build/native_test --output-on-failure --no-tests=error --timeout 30

      - name: Run host and production protocol tests with coverage
        if: github.event_name != 'pull_request'
        env:
          CC: /usr/bin/clang
        run: |
          cmake -S test/native -B build/native_test \
            -DCMAKE_BUILD_TYPE=Debug -DTUNNEL_FORGE_NATIVE_PROTOCOL_TESTS=ON \
            -DTUNNEL_FORGE_MBEDTLS_SOURCE_DIR="${{ runner.temp }}/mbedtls-2.28.9" \
            -DCMAKE_C_FLAGS='-fprofile-instr-generate -fcoverage-mapping' \
            -DCMAKE_EXE_LINKER_FLAGS=-fprofile-instr-generate
          cmake --build build/native_test --parallel
          export LLVM_PROFILE_FILE="$PWD/build/native_test/%m-%p.profraw"
          ctest --test-dir build/native_test --output-on-failure --no-tests=error --timeout 30

      - name: Collect native C coverage
        if: github.event_name != 'pull_request'
        run: |
          /usr/bin/llvm-profdata merge -sparse build/native_test/*.profraw -o build/native.profdata
          binaries=()
          for binary in build/native_test/test_*; do
            binaries+=("-object=$binary")
          done
          /usr/bin/llvm-cov export -format=lcov -instr-profile=build/native.profdata \
            "${binaries[@]}" -ignore-filename-regex='/test/native/(test_[^/]+\.c$|stubs/)|/mbedtls(-src|-2\.28\.9)?/|^/usr/' \
            > build/native-coverage.info
          grep -q '^SF:' build/native-coverage.info

      - name: Save native C coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: native-c-coverage
          path: build/native-coverage.info
          if-no-files-found: error

      - name: Upload native C coverage to Codecov
        if: github.event_name != 'pull_request' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/native-coverage.info
          flags: native-c
          disable_search: true
          fail_ci_if_error: true

  android-unit-tests:
    name: android-unit-tests
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.android_kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Get dependencies
        run: flutter pub get

      - name: Create Android local.properties
        working-directory: android
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME must be set" >&2
            exit 1
          fi

          {
            echo "flutter.sdk=${flutter_root}"
            echo "sdk.dir=${android_sdk_root}"
          } > local.properties

      - name: Install Android API 37
        run: |
          "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0'

      - name: Run Android JVM tests and lint
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew --no-daemon --console=plain --stacktrace -Dorg.gradle.vfs.watch=false :app:testDebugUnitTest :app:lintDebug

      - name: Run Android JVM tests with coverage and lint
        if: github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew --no-daemon --console=plain --stacktrace -Dorg.gradle.vfs.watch=false -PtunnelForgeCoverage :app:createDebugUnitTestCoverageReport :app:lintDebug

      - name: Save Android coverage
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-coverage
          path: build/app/reports/coverage/
          if-no-files-found: ignore

      - name: Upload Kotlin coverage to Codecov
        if: github.event_name != 'pull_request' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/app/reports/coverage/test/debug/report.xml
          flags: kotlin
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Android test results to Codecov
        if: ${{ !cancelled() && github.event_name != 'pull_request' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: build/app/test-results/testDebugUnitTest
          report_type: test_results

      - name: Upload Android unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            build/app/reports/tests/
            build/app/reports/lint-results-debug.*
            build/reports/
          if-no-files-found: ignore

  build-android:
    name: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare Android Go dependencies
        uses: actions/setup-go@v7
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Get dependencies
        run: flutter pub get

      - name: Download Android Go module dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Create Android local.properties
        working-directory: android
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME must be set" >&2
            exit 1
          fi

          {
            echo "flutter.sdk=${flutter_root}"
            echo "sdk.dir=${android_sdk_root}"
          } > local.properties

      - name: Install Android API 37
        run: |
          "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0'

      - name: Configure Android release signing
        if: github.event_name != 'pull_request' && inputs.pr_number == ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TUNNEL_FORGE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
        run: |
          for var in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "Missing required GitHub Actions secret: ${var}" >&2
              exit 1
            fi
          done

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${TUNNEL_FORGE_ANDROID_KEYSTORE_PATH}"
          chmod 600 "${TUNNEL_FORGE_ANDROID_KEYSTORE_PATH}"

      - name: Build release APKs
        if: github.event_name != 'pull_request' && inputs.pr_number == ''
        env:
          TUNNEL_FORGE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          TUNNEL_FORGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TUNNEL_FORGE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TUNNEL_FORGE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          rm -rf dist/ci-release-apks
          mkdir -p dist/ci-release-apks
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/app-x86_64-release.apk \
             dist/ci-release-apks/
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/ci-release-apks/app-universal-release.apk

      - name: Verify release APKs
        if: github.event_name != 'pull_request' && inputs.pr_number == ''
        run: |
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "Android SDK root is not set" >&2
            exit 1
          fi

          apksigner_path="$(
            find "${android_sdk_root}/build-tools" \
              -maxdepth 2 \
              -type f \
              -name apksigner \
              -executable |
              sort -V |
              tail -n 1
          )"

          if [[ -z "${apksigner_path}" ]]; then
            echo "apksigner not found under ${android_sdk_root}/build-tools" >&2
            exit 1
          fi

          aapt2_path="$(
            find "${android_sdk_root}/build-tools" \
              -maxdepth 2 \
              -type f \
              -name aapt2 \
              -executable |
              sort -V |
              tail -n 1
          )"

          if [[ -z "${aapt2_path}" ]]; then
            echo "aapt2 not found under ${android_sdk_root}/build-tools" >&2
            exit 1
          fi

          base_version_code="$(awk -F'[ +]+' '/^version:/ {print $3; exit}' pubspec.yaml | tr -d '\r')"
          if [[ ! "${base_version_code}" =~ ^[0-9]+$ ]]; then
            echo "Failed to parse numeric base versionCode from pubspec.yaml: '${base_version_code}'" >&2
            exit 1
          fi

          echo "Using apksigner: ${apksigner_path}"
          echo "Using aapt2: ${aapt2_path}"

          declare -A expected_offsets=(
            ["app-armeabi-v7a-release.apk"]=1
            ["app-arm64-v8a-release.apk"]=2
            ["app-x86_64-release.apk"]=3
            ["app-universal-release.apk"]=4
          )

          for apk_name in \
            app-armeabi-v7a-release.apk \
            app-arm64-v8a-release.apk \
            app-x86_64-release.apk \
            app-universal-release.apk; do
            apk_path="dist/ci-release-apks/${apk_name}"
            expected_version_code="$((base_version_code * 10 + expected_offsets[${apk_name}]))"

            "${apksigner_path}" verify --verbose "${apk_path}"

            badging="$("${aapt2_path}" dump badging "${apk_path}")"
            pkg_line="$(printf '%s\n' "${badging}" | grep -m1 '^package: ' || true)"
            echo "${apk_name}: ${pkg_line}"

            if ! printf '%s\n' "${pkg_line}" | grep -q "name='io.github.evokelektrique.tunnelforge'"; then
              echo "Unexpected package name in ${apk_path}" >&2
              exit 1
            fi
            if ! printf '%s\n' "${pkg_line}" | grep -q "versionCode='${expected_version_code}'"; then
              echo "Expected versionCode '${expected_version_code}' in ${apk_path}" >&2
              exit 1
            fi
          done

      - name: Upload APK
        if: github.event_name != 'pull_request' && inputs.pr_number == ''
        uses: actions/upload-artifact@v7
        with:
          name: tunnel-forge-release-apk
          path: dist/ci-release-apks/*.apk
          if-no-files-found: error

      - name: Build reviewer APK
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        env:
          ORG_GRADLE_PROJECT_tunnelForgeDebugAppIdSuffix: .debug
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify reviewer APK
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        run: |
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "Android SDK root is not set" >&2
            exit 1
          fi

          apksigner_path="$(
            find "${android_sdk_root}/build-tools" \
              -maxdepth 2 \
              -type f \
              -name apksigner \
              -executable |
              sort -V |
              tail -n 1
          )"

          if [[ -z "${apksigner_path}" ]]; then
            echo "apksigner not found under ${android_sdk_root}/build-tools" >&2
            exit 1
          fi

          aapt2_path="$(
            find "${android_sdk_root}/build-tools" \
              -maxdepth 2 \
              -type f \
              -name aapt2 \
              -executable |
              sort -V |
              tail -n 1
          )"

          if [[ -z "${aapt2_path}" ]]; then
            echo "aapt2 not found under ${android_sdk_root}/build-tools" >&2
            exit 1
          fi

          echo "Using apksigner: ${apksigner_path}"
          "${apksigner_path}" verify --verbose \
            build/app/outputs/flutter-apk/app-debug.apk

          base_version_code="$(awk -F'[ +]+' '/^version:/ {print $3; exit}' pubspec.yaml | tr -d '\r')"
          if [[ ! "${base_version_code}" =~ ^[0-9]+$ ]]; then
            echo "Failed to parse numeric base versionCode from pubspec.yaml: '${base_version_code}'" >&2
            exit 1
          fi
          expected_version_code="$((base_version_code * 10 + 4))"

          echo "Using aapt2: ${aapt2_path}"
          badging="$("${aapt2_path}" dump badging build/app/outputs/flutter-apk/app-debug.apk)"
          pkg_line="$(printf '%s\n' "${badging}" | grep -m1 '^package: ' || true)"
          echo "${pkg_line}"

          if ! printf '%s\n' "${pkg_line}" | grep -q "name='io.github.evokelektrique.tunnelforge.debug'"; then
            echo "Expected package name 'io.github.evokelektrique.tunnelforge.debug' in app-debug.apk" >&2
            exit 1
          fi
          if ! printf '%s\n' "${pkg_line}" | grep -q "versionCode='${expected_version_code}'"; then
            echo "Expected versionCode '${expected_version_code}' in app-debug.apk" >&2
            exit 1
          fi

      - name: Upload reviewer APK
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        uses: actions/upload-artifact@v7
        with:
          name: tunnel-forge-pr-${{ inputs.pr_number || github.event.pull_request.number }}-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-reports
          path: |
            build/reports/
            build/app/reports/
          if-no-files-found: ignore
