name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 15 * * 5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0
  JAVA_VERSION: "17"
  ANDROID_PLATFORM: android-31
  ANDROID_ABI: arm64-v8a

defaults:
  run:
    shell: bash

jobs:
  analyze-actions:
    name: Analyze GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - '.dart_tool/**'
              - 'build/**'
              - 'coverage/**'
              - 'ios/**'
              - 'linux/**'
              - 'macos/**'
              - 'web/**'
              - 'windows/**'
              - '**/_deps/**'
              - '**/third_party/**'
              - '**/thirdparty/**'
              - '**/vendor/**'
              - '**/external/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions

  analyze-android-go:
    name: Analyze Android Go
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          dependency-caching: false
          queries: security-extended,security-and-quality
          config: |
            paths:
              - 'android/gvisor'
            paths-ignore:
              - '.dart_tool/**'
              - 'build/**'
              - 'coverage/**'
              - 'ios/**'
              - 'linux/**'
              - 'macos/**'
              - 'web/**'
              - 'windows/**'
              - '**/_deps/**'
              - '**/third_party/**'
              - '**/thirdparty/**'
              - '**/vendor/**'
              - '**/external/**'

      - name: Download Android Go module dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Build Android Go module for CodeQL
        working-directory: android/gvisor
        run: go test ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:go

  analyze-android-kotlin:
    name: Analyze Android Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare Android Go dependencies
        uses: actions/setup-go@v7
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - '.dart_tool/**'
              - 'build/**'
              - 'coverage/**'
              - 'ios/**'
              - 'linux/**'
              - 'macos/**'
              - 'web/**'
              - 'windows/**'
              - '**/_deps/**'
              - '**/third_party/**'
              - '**/thirdparty/**'
              - '**/vendor/**'
              - '**/external/**'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Download Android Go module dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Create Android local.properties
        working-directory: android
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME must be set" >&2
            exit 1
          fi

          {
            echo "flutter.sdk=${flutter_root}"
            echo "sdk.dir=${android_sdk_root}"
          } > local.properties

      - name: Build Kotlin targets for CodeQL
        working-directory: android
        run: |
          ./gradlew --stop || true

          ./gradlew --no-daemon --no-build-cache --rerun-tasks --console=plain --stacktrace \
            -Dorg.gradle.vfs.watch=false \
            clean \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            :app:compileDebugUnitTestKotlin \
            :app:compileDebugAndroidTestKotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  analyze-android-native:
    name: Analyze Android C/C++
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          dependency-caching: true
          queries: security-extended,security-and-quality

      - name: Install native build tools
        id: install_native_tools
        run: |
          cache_dir="${RUNNER_TEMP}/native-tools-apt-cache"
          mkdir -p "${cache_dir}"
          rm -f "${cache_dir}"/*.deb

          os_id="$(. /etc/os-release && printf '%s-%s' "${ID:-linux}" "${VERSION_ID:-unknown}")"
          echo "os_id=${os_id}" >> "${GITHUB_OUTPUT}"

          sudo apt-get clean
          if sudo apt-get update && \
             sudo apt-get install -y --download-only -o APT::Keep-Downloaded-Packages=true cmake ninja-build; then
            if compgen -G "/var/cache/apt/archives/*.deb" >/dev/null; then
              cp /var/cache/apt/archives/*.deb "${cache_dir}/"
              sudo apt-get install -y --no-download cmake ninja-build
              packages_hash="$(find "${cache_dir}" -maxdepth 1 -name '*.deb' -printf '%f\n' | LC_ALL=C sort | sha256sum | awk '{print $1}')"
              echo "has_debs=true" >> "${GITHUB_OUTPUT}"
              echo "packages_hash=${packages_hash}" >> "${GITHUB_OUTPUT}"
            else
              echo "has_debs=false" >> "${GITHUB_OUTPUT}"
            fi
            echo "download_failed=false" >> "${GITHUB_OUTPUT}"
          else
            rm -f "${cache_dir}"/*.deb
            echo "::warning::Failed to download cmake and ninja-build via apt-get; falling back to latest cached packages."
            echo "has_debs=false" >> "${GITHUB_OUTPUT}"
            echo "download_failed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check native build tools cache
        id: check_native_tools_cache
        if: steps.install_native_tools.outputs.download_failed == 'false' && steps.install_native_tools.outputs.has_debs == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/native-tools-apt-cache
          key: native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.install_native_tools.outputs.os_id }}-${{ steps.install_native_tools.outputs.packages_hash }}
          lookup-only: true

      - name: Save native build tools cache
        if: steps.install_native_tools.outputs.download_failed == 'false' && steps.install_native_tools.outputs.has_debs == 'true' && steps.check_native_tools_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/native-tools-apt-cache
          key: native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.install_native_tools.outputs.os_id }}-${{ steps.install_native_tools.outputs.packages_hash }}

      - name: Restore cached native build tools
        if: steps.install_native_tools.outputs.download_failed == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/native-tools-apt-cache
          key: native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.install_native_tools.outputs.os_id }}-fallback-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-build-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.install_native_tools.outputs.os_id }}-

      - name: Install cached native build tools
        if: steps.install_native_tools.outputs.download_failed == 'true'
        run: |
          cache_dir="${RUNNER_TEMP}/native-tools-apt-cache"
          if ! compgen -G "${cache_dir}/*.deb" >/dev/null; then
            echo "::error::Package download failed and no cached native build tools were found under ${cache_dir}." >&2
            exit 1
          fi
          sudo dpkg -i "${cache_dir}"/*.deb

      - name: Locate Android NDK
        run: |
          if [[ -n "${ANDROID_NDK_HOME:-}" ]]; then
            echo "ANDROID_NDK_PATH=${ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          elif [[ -n "${ANDROID_NDK_ROOT:-}" ]]; then
            echo "ANDROID_NDK_PATH=${ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
          else
            ndk_path="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            if [[ -z "${ndk_path}" ]]; then
              echo "Could not find Android NDK" >&2
              exit 1
            fi
            echo "ANDROID_NDK_PATH=${ndk_path}" >> "$GITHUB_ENV"
          fi

      - name: Print native toolchain info
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_NDK_PATH=${ANDROID_NDK_PATH}"
          echo "ANDROID_ABI=${ANDROID_ABI}"
          echo "ANDROID_PLATFORM=${ANDROID_PLATFORM}"
          cmake --version
          ninja --version

      - name: Configure Android native CMake target
        run: |
          cmake -S android/app/src/main/cpp \
            -B build/codeql-native \
            -G Ninja \
            -Wno-deprecated \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Show project native compile commands
        run: |
          if [[ ! -f build/codeql-native/compile_commands.json ]]; then
            echo "compile_commands.json was not generated" >&2
            exit 1
          fi

          grep -E 'android/app/src/main/cpp/.*\.(c|cc|cpp|cxx)' build/codeql-native/compile_commands.json || true

      - name: Build Android app native target for CodeQL
        run: |
          cmake --build build/codeql-native --target tunnel_engine --verbose

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
