name: tunnel_forge
description: TunnelForge - L2TP/IPsec VPN for Android.
publish_to: "none"

version: 0.8.0+213

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.7.1
  bloc: ^9.2.1
  cross_file: ^0.3.5+5
  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.6
  file_picker: ^13.3.3
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  material_ui: ^1.11.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: Estedad
      fonts:
        - asset: resources/fonts/estedad/Estedad-Thin.ttf
          weight: 100
        - asset: resources/fonts/estedad/Estedad-ExtraLight.ttf
          weight: 200
        - asset: resources/fonts/estedad/Estedad-Light.ttf
          weight: 300
        - asset: resources/fonts/estedad/Estedad-Regular.ttf
          weight: 400
        - asset: resources/fonts/estedad/Estedad-Medium.ttf
          weight: 500
        - asset: resources/fonts/estedad/Estedad-SemiBold.ttf
          weight: 600
        - asset: resources/fonts/estedad/Estedad-Bold.ttf
          weight: 700
        - asset: resources/fonts/estedad/Estedad-ExtraBold.ttf
          weight: 800
        - asset: resources/fonts/estedad/Estedad-Black.ttf
          weight: 900
